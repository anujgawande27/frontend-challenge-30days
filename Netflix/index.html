<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div class="top">
        <nav>
            <div class="nav-1 navpart">
                <img src="./netfliximages/Netflix_Logo_PMS.png" alt="logo Netflix" width="180px">
            </div>
            <div class="nav-2 navpart">
                <select name="Lang" id="Lang">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                </select>
                <button>SignIn</button>
            </div>
        </nav>
        <div class="topmain">
            <h1>Unlimited movies,<br> shows, and more</h1>
            <h4>Starts at ₹149. Cancel at any time.</h4>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
            <span><input type="text" placeholder="Email address"><button>Get Started <i class="ri-arrow-right-s-line"></i></button></span>
        </div>
    </div>
    <div class="border">

    </div>
    <div class="bottom">
        <div class="cover"></div>
    </div>
    <div class="slider">
            <div class="slide"><img src="./netfliximages/1.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/2.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/3.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/4.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/5.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/6.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/7.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/8.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/9.webp" alt=""></div>
            <div class="slide"><img src="./netfliximages/10.webp" alt=""></div>
    </div>
    
</body>
</html>
